[project]
name = "ms-dashboard-bff"
version = "0.1.0"
description = "BFF do ms-dashboard (Módulo 6) — portal web central e agregador de métricas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
    "C408",
    "SIM117",
    "UP046",
    "S110",
]
