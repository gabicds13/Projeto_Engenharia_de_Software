services:
  - type: web
    name: ms-dashboard-bff-gabi13
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_MOCKS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEV_LOGIN
        value: "true"
      - key: CORS_ORIGINS
        value: https://ms-dashboard-web-gabi13.onrender.com

  - type: web
    name: ms-dashboard-web-gabi13
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ms-dashboard-bff-gabi13.onrender.com
