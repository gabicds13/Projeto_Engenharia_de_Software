name: Validate modulo6 features

on:
  push:
    branches:
      - chat-comunicacao
      - modulo6-proxima-etapa
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-chat-comunicacao.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check --select E4,E7,E9,F backend/app backend/tests
      - name: Tests
        working-directory: backend
        env:
          APP_ENV: development
          USE_MOCKS: "true"
          USE_CHAT_DB: "false"
          USE_NOTIFICATIONS_DB: "false"
          JWT_SECRET: test-secret
        run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: npm run build
      - name: Frontend tests
        working-directory: frontend
        run: npm test
