name: Verificar frontend e BFF com M1 offline (sem deploy)
on:
  push:
    branches:
      - demo/capturas-sem-modulo1
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Testes de interface
        working-directory: frontend
        run: npm test
      - name: Compilar interface
        working-directory: frontend
        run: npm run build:demo

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
      - name: Testes de M1 offline
        working-directory: backend
        env:
          APP_ENV: development
          USE_MOCKS: "true"
          JWT_SECRET: test-secret
        run: python -m pytest tests/test_module1_offline_demo.py -v
