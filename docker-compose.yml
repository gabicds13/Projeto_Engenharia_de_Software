# ms-dashboard (Módulo 6) — ambiente LOCAL: sobe portal + BFF com um comando.
#
#   docker compose up --build
#   -> portal em http://localhost:8080   | BFF em http://localhost:8006
#
# Aqui o portal usa caminhos relativos (/api, /ws) e o nginx encaminha ao serviço
# "bff" na rede do compose, então VITE_API_BASE_URL fica vazio.
# Para o deploy na nuvem, veja render.yaml e o README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: module6
      POSTGRES_PASSWORD: module6-local
      POSTGRES_DB: module6
    volumes:
      - module6-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U module6 -d module6"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  bff:
    build: ./backend
    environment:
      APP_ENV: development
      PORT: 8006
      USE_MOCKS: "true"  # mocks dos outros modulos, que ainda nao enviaram APIs
      USE_CHAT_DB: "true"
      USE_NOTIFICATIONS_DB: "true"
      DATABASE_URL: postgresql://module6:module6-local@db:5432/module6
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: http://localhost:8080
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8006:8006"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "" # vazio => caminhos relativos (nginx faz proxy ao bff)
    environment:
      PORT: 80
    depends_on:
      - bff
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  module6-postgres:
